<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Global bulk transport — cost / CO2 from source</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html, body { height:100%; margin:0; font-family: ui-sans-serif, system-ui, sans-serif; color:#222 }
    #wrap { display: grid; grid-template-columns: 280px 1fr; height:100vh; }
    #side { padding: 16px; border-right: 1px solid #ddd; overflow-y:auto; background:#fafafa }
    #map  { height: 100vh; }
    h1 { font-size: 16px; margin: 0 0 8px 0 }
    h2 { font-size: 13px; margin: 16px 0 6px 0; color:#555 }
    label { display:block; font-size:13px; margin: 6px 0 }
    select, input[type=text] { width: 100%; padding: 4px; }
    .legend { background: #fff; padding: 6px 8px; box-shadow: 0 1px 4px rgba(0,0,0,.2); font-size: 12px; line-height: 1.4 }
    .legend i { display:inline-block; width:14px; height:14px; margin-right:6px; vertical-align:middle; opacity:.85 }
    .src-marker { width: 14px; height: 14px; background: #d33; border:2px solid #fff; border-radius:50%; box-shadow:0 0 0 1px rgba(0,0,0,.3); }
    .small { font-size: 11px; color:#777; line-height:1.4 }
  </style>
</head>
<body>
<div id="wrap">
  <div id="side">
    <h1>global bulk transport</h1>
    <p class="small">Pick a source &amp; metric; map shades the per-destination value over the 0.5° cropland grid.</p>

    <h2>source</h2>
    <select id="source"></select>

    <h2>metric</h2>
    <select id="metric">
      <option value="cost_total">delivered cost (USD/t)</option>
      <option value="co2_total">delivered CO₂ (g/t)</option>
      <option value="length_km">network distance (km)</option>
    </select>

    <h2>info</h2>
    <div id="info" class="small">—</div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([20, 0], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { attribution: '© OpenStreetMap contributors', maxZoom: 8 }).addTo(map);

const sourceSel = document.getElementById('source');
const metricSel = document.getElementById('metric');
const infoEl = document.getElementById('info');

let cellsLayer = L.layerGroup().addTo(map);
let sourceMarker = null;
let legend = null;

function color(v, breaks) {
  // viridis-ish 5-step ramp
  const ramp = ['#440154','#3b528b','#21918c','#5ec962','#fde725'];
  for (let i = 0; i < breaks.length; ++i) if (v <= breaks[i]) return ramp[i];
  return ramp[ramp.length - 1];
}

function renderLegend(metric, breaks) {
  if (legend) legend.remove();
  legend = L.control({position:'bottomright'});
  legend.onAdd = () => {
    const d = L.DomUtil.create('div','legend');
    d.innerHTML = '<b>' + metric + '</b><br>';
    const ramp = ['#440154','#3b528b','#21918c','#5ec962','#fde725'];
    breaks.forEach((b, i) => {
      d.innerHTML += '<i style="background:' + ramp[i] + '"></i>≤ ' + b.toLocaleString(undefined,{maximumSignificantDigits:3}) + '<br>';
    });
    return d;
  };
  legend.addTo(map);
}

async function loadGrid() {
  const sid = sourceSel.value, m = metricSel.value;
  if (!sid) return;
  cellsLayer.clearLayers();
  const r = await fetch(`/grid/${sid}?metric=${m}`);
  if (!r.ok) { infoEl.textContent = 'error: ' + r.status; return; }
  const j = await r.json();
  infoEl.innerHTML = `<b>${sid}</b><br>cells: ${j.n}<br>metric: ${j.metric}`;
  j.cells.forEach(c => {
    L.circleMarker([c.lat, c.lon], {
      radius: 3, weight: 0, fillOpacity: 0.65,
      fillColor: color(c.v, j.breaks),
    }).bindTooltip(`${c.v.toLocaleString(undefined,{maximumSignificantDigits:4})}`).addTo(cellsLayer);
  });
  renderLegend(m, j.breaks);
}

async function init() {
  const r = await fetch('/sources');
  const list = await r.json();
  list.forEach(s => {
    const o = document.createElement('option');
    o.value = s.source_id;
    o.textContent = `${s.name} (${s.source_id})`;
    o.dataset.lon = s.lon; o.dataset.lat = s.lat;
    sourceSel.appendChild(o);
  });
  if (list.length) {
    const s = list[0];
    sourceMarker = L.marker([s.lat, s.lon], { title: s.name }).addTo(map);
    sourceSel.value = s.source_id;
    map.setView([s.lat, s.lon], 4);
    loadGrid();
  }
}
sourceSel.addEventListener('change', () => {
  const o = sourceSel.selectedOptions[0];
  if (sourceMarker) sourceMarker.remove();
  sourceMarker = L.marker([+o.dataset.lat, +o.dataset.lon]).addTo(map);
  map.setView([+o.dataset.lat, +o.dataset.lon], 4);
  loadGrid();
});
metricSel.addEventListener('change', loadGrid);
init();
</script>
</body>
</html>
