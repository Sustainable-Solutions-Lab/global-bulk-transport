[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-bulk-transport"
version = "0.1.0"
description = "Global multimodal bulk-transport graph with cost & CO2 attribution for ERW research"
requires-python = ">=3.11"
authors = [{name = "Koen van Greevenbroek", email = "koenvg@stanford.edu"}]
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET"]
ignore = ["E501"]
